# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: anthoney's
subtitle: ''
description: ''
keywords: ''
author: anthoney
language: en
timezone: ''

# URL
url: https://anthoney.cn
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: diaspora

# Deployment
deploy:
  type: git
  repo: https://github.com/anthoneycn/anthoneycn.github.io.git
  branch: main

# Local search (hexo-generator-search)
search:
  path: search.xml
  field: post
  content: false

# Feed (hexo-generator-feed)
feed:
  type: atom
  path: atom.xml
  limit: 20
